<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探索者ファイル | キャラクターシート選択</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEEEA; --surface:#FFFFFF; --ink:#1B1E23; --muted:#6B7280;
  --line:#CBCFD2; --accent:#7A1F2B; --accent-soft:#F4E1E2; --accent-deep:#4E1319;
  --font-display:'Shippori Mincho',serif; --font-body:'Zen Kaku Gothic New',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 1px 1px, rgba(27,30,35,0.05) 1px, transparent 0);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.wrap{max-width:900px;margin:0 auto;padding:60px 20px 80px;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:10px;}
h1{font-family:var(--font-display);font-weight:800;font-size:32px;text-align:center;margin:0 0 8px;letter-spacing:.04em;}
.lede{text-align:center;font-size:13px;color:var(--muted);margin:0 0 48px;font-family:var(--font-mono);}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;}
.card{
  display:block;text-decoration:none;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:26px 22px;position:relative;overflow:hidden;transition:transform .15s, box-shadow .15s, border-color .15s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(27,30,35,.35);border-color:var(--accent);}
.card .tag{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--accent);
  border:1px solid var(--accent);display:inline-block;padding:3px 9px;border-radius:20px;margin-bottom:14px;
}
.card h2{font-family:var(--font-display);font-size:20px;margin:0 0 8px;}
.card p{font-size:13px;color:var(--muted);margin:0 0 18px;min-height:36px;}
.card .go{font-family:var(--font-mono);font-size:12px;color:var(--ink);display:flex;align-items:center;gap:6px;}
.card:hover .go{color:var(--accent);}
.card .go::after{content:'→';transition:transform .15s;}
.card:hover .go::after{transform:translateX(4px);}

.card.add-more{
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
  border-style:dashed;color:var(--muted);text-align:center;font-family:var(--font-mono);font-size:12px;
}
.card.add-more b{font-family:var(--font-display);font-size:15px;color:var(--muted);font-weight:700;}

.footer-note{text-align:center;margin-top:48px;font-size:11px;color:var(--muted);font-family:var(--font-mono);}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Case File Archive</div>
  <h1>探索者ファイル</h1>
  <p class="lede">作成するキャラクターシートの種類を選んでください</p>

  <div class="grid">
    <a class="card" href="sheet.html?type=modern6">
      <div class="tag">クトゥルフ神話TRPG 6版</div>
      <h2>6版現代探索者シート</h2>
      <p>現代を舞台にした、標準的なクトゥルフ神話TRPG 6版の探索者を作成します。</p>
      <div class="go">キャラクターを作成する</div>
    </a>

    <a class="card" href="sheet.html?type=cat6">
      <div class="tag">クトゥルフ神話TRPG 6版</div>
      <h2>6版猫探索者シート</h2>
      <p>猫の探索者を作成するためのシートです。</p>
      <div class="go">キャラクターを作成する</div>
    </a>

    <div class="card add-more">
      <b>+ 今後追加予定</b>
      <span>他の時代・トーンのシートも順次追加していきます</span>
    </div>
  </div>

  <div class="footer-note">既に作成済みのキャラクターは、各シート内の「読み込む」からJSONファイルを開いてください</div>
</div>
</body>
</html>
